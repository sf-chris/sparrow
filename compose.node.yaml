# Sparrow Node on Linux: this computer's media folders, paired with a Sparrow server.
# Without Docker, the one-line command in Settings → Storage → Pair a computer is simpler.
# With Docker, take the code from that command (the part before .sh), pair, then start:
#   docker compose -f compose.node.yaml run --rm node configure --server http://SERVER:PORT \
#     --code CODE --allow-private-http --managed-downloader
#   docker compose -f compose.node.yaml up -d
# Then choose its folders in Sparrow (they're under /media here), or give them above
# with --library /media/Library --staging /media/Incoming (repeat --library per disk).
services:
  node:
    build: .
    image: sparrow:local
    restart: unless-stopped
    init: true
    entrypoint: ["python", "-m", "backend.agents.node_client", "--config", "/data/node.json"]
    command: ["run"]
    # Downloads need inbound peer connections; the node only calls out to the server.
    network_mode: host
    volumes:
      - sparrow-node:/data
      - ${SPARROW_MEDIA_DIR:-sparrow-node-media}:/media
    group_add:
      - "${SPARROW_MEDIA_GID:-10001}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
volumes:
  sparrow-node:
  sparrow-node-media:
