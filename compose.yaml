services:
  sparrow:
    build: .
    image: sparrow:local
    restart: unless-stopped
    init: true
    environment:
      SPARROW_SMART_MODEL: ${SPARROW_SMART_MODEL:-assistant-medium}
      SPARROW_CHEAP_MODEL: ${SPARROW_CHEAP_MODEL:-assistant-small}
      SPARROW_TRANSCRIPTION_MODEL: ${SPARROW_TRANSCRIPTION_MODEL:-/opt/sparrow/models/whisper-base}
      # Subtitle agent: Large manages; a cheap page checker (the cheap model when an
      # AltProvider key is set) reads every page. Leave unset for the defaults.
      SPARROW_SUBTITLE_MODEL: ${SPARROW_SUBTITLE_MODEL:-}
      SPARROW_SUBTITLE_EFFORT: ${SPARROW_SUBTITLE_EFFORT:-medium}
      SPARROW_SUBTITLE_BUDGET: ${SPARROW_SUBTITLE_BUDGET:-}
      SPARROW_SUBTITLE_CONTRACTOR: ${SPARROW_SUBTITLE_CONTRACTOR:-}
      SPARROW_SUBTITLE_VERIFIER: ${SPARROW_SUBTITLE_VERIFIER:-}
      ALTPROVIDER_API_KEY: ${ALTPROVIDER_API_KEY:-}
    ports:
      - "${SPARROW_BIND_ADDRESS:-127.0.0.1}:${SPARROW_PORT:-8888}:8888"
    volumes:
      - sparrow-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
volumes:
  sparrow-data:
