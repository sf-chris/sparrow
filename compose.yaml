services:
  sparrow:
    build: .
    image: sparrow:local
    restart: unless-stopped
    init: true
    environment:
      SPARROW_SMART_MODEL: ${SPARROW_SMART_MODEL:-claude-sonnet-5}
      SPARROW_CHEAP_MODEL: ${SPARROW_CHEAP_MODEL:-claude-haiku-4-5}
      SPARROW_TRANSCRIPTION_MODEL: ${SPARROW_TRANSCRIPTION_MODEL:-/opt/sparrow/models/whisper-base}
      # Subtitle agent: Opus manages; a cheap page checker (GPT-6-Luna when an
      # OpenAI key is set) reads every page. Leave unset for the defaults.
      SPARROW_SUBTITLE_MODEL: ${SPARROW_SUBTITLE_MODEL:-}
      SPARROW_SUBTITLE_EFFORT: ${SPARROW_SUBTITLE_EFFORT:-medium}
      SPARROW_SUBTITLE_BUDGET: ${SPARROW_SUBTITLE_BUDGET:-}
      SPARROW_SUBTITLE_CONTRACTOR: ${SPARROW_SUBTITLE_CONTRACTOR:-}
      SPARROW_SUBTITLE_VERIFIER: ${SPARROW_SUBTITLE_VERIFIER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${SPARROW_BIND_ADDRESS:-127.0.0.1}:${SPARROW_PORT:-8888}:8888"
    volumes:
      - sparrow-data:/data
      # Films, series and downloads. Set SPARROW_MEDIA_DIR to a folder on this
      # computer to use it; otherwise they stay in a Docker volume.
      - ${SPARROW_MEDIA_DIR:-sparrow-media}:/media
    # Lets Sparrow write to that folder when your group owns it.
    group_add:
      - "${SPARROW_MEDIA_GID:-10001}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
volumes:
  sparrow-data:
  sparrow-media:
