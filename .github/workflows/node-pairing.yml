name: Pair a computer from one command
on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/agents/node_install/**
      - backend/agents/node_package.py
      - backend/agents/node_client.py
      - backend/agents/folders.py
      - tests/node_pairing_check.py
      - .github/workflows/node-pairing.yml
permissions:
  contents: read
jobs:
  pair:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            flags: ''
          - os: macos-latest
            flags: --no-system-python
          - os: ubuntu-24.04
            flags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Run the one-line command and choose folders from Sparrow
        run: python tests/node_pairing_check.py ${{ matrix.flags }}
