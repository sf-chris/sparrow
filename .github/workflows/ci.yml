name: Product checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg ripgrep
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: scripts/check.sh
      - name: Browser journeys and accessibility
        run: tests/browser/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: tests/browser/artifacts
      - name: Container build
        run: docker build -t sparrow:check .
      - name: Start packaged server
        id: container
        run: docker run -d --name sparrow-check -p 127.0.0.1:8892:8888 sparrow:check
      - name: Container acceptance
        run: .venv/bin/python tests/package_check.py
      - if: always() && steps.container.outcome == 'success'
        run: docker logs sparrow-check
