name: Bug report
description: Report a reproducible Sparrow problem (not a security issue)
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private media names, or download history. Report vulnerabilities privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Sparrow version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Include the expected result and the actual plain-language journal state.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Remove paths or other private details before pasting.
